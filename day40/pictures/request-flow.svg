<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="600" y="60" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Day 40: AWS Load Balancer Controller</text>
  <text x="600" y="95" text-anchor="middle" font-size="20" fill="#475569">Request flow: Ingress to ALB to Pod on EKS</text>

  <!-- Row 1: request path -->
  <g font-size="18" text-anchor="middle" fill="#0f172a">
    <rect x="50" y="190" width="150" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="125" y="232" font-weight="bold">Internet</text>
    <text x="125" y="258" font-size="16">User</text>

    <rect x="240" y="190" width="150" height="100" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="315" y="232" font-weight="bold">DNS</text>
    <text x="315" y="258" font-size="15">app.example.com</text>

    <rect x="430" y="190" width="150" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="505" y="225" font-weight="bold">ALB Listener</text>
    <text x="505" y="250" font-size="15">80 / 443</text>
    <text x="505" y="272" font-size="15">TLS ends here</text>

    <rect x="620" y="190" width="150" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="695" y="232" font-weight="bold">Rule</text>
    <text x="695" y="258" font-size="15">host + path</text>

    <rect x="810" y="190" width="150" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="885" y="232" font-weight="bold">Target Group</text>
    <text x="885" y="258" font-size="15">health checks</text>

    <rect x="1000" y="190" width="150" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1075" y="232" font-weight="bold">App Pod</text>
    <text x="1075" y="258" font-size="15">web-service:80</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="200" y1="240" x2="238" y2="240"/>
    <line x1="390" y1="240" x2="428" y2="240"/>
    <line x1="580" y1="240" x2="618" y2="240"/>
    <line x1="770" y1="240" x2="808" y2="240"/>
    <line x1="960" y1="240" x2="998" y2="240"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-size="16" fill="#64748b">User request goes left to right, response comes back the same way</text>

  <!-- Row 2: Kubernetes control side -->
  <rect x="250" y="410" width="560" height="150" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="270" y="438" font-size="15" fill="#64748b">Kubernetes cluster (EKS)</text>

  <g font-size="18" text-anchor="middle" fill="#0f172a">
    <rect x="280" y="455" width="200" height="85" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="380" y="490" font-weight="bold">Ingress</text>
    <text x="380" y="514" font-size="15">rules only</text>

    <rect x="560" y="455" width="220" height="85" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="670" y="490" font-weight="bold">LB Controller</text>
    <text x="670" y="514" font-size="15">watches and reconciles</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="558" y1="498" x2="482" y2="498"/>
    <path d="M670 453 L670 350 L505 350 L505 292"/>
  </g>
  <text x="520" y="338" font-size="15" fill="#0f172a">creates / updates ALB, listener, target group</text>
  <text x="520" y="488" font-size="15" fill="#0f172a">watches</text>

  <text x="600" y="620" text-anchor="middle" font-size="18" fill="#0f172a">Ingress = rules. Controller = makes them real in AWS.</text>
  <text x="600" y="648" text-anchor="middle" font-size="15" fill="#64748b">#DevOps #AWS #EKS #Kubernetes #WinterArc</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
