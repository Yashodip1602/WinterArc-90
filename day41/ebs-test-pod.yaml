
apiVersion: v1
kind: Pod
metadata:
  name: ebs-test-pod
  namespace: dev
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "while true; do sleep 3600; done"
      volumeMounts:
        - name: ebs-storage
          mountPath: /data
  volumes:
    - name: ebs-storage
      persistentVolumeClaim:
        claimName: ebs-test-pvc
